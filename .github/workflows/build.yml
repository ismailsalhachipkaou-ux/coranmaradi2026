name: Construire l'APK tout-en-un

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SITE: https://coran-maradi.ismailsalhachipkaou.workers.dev
  AUDIO_SOURCE: https://pub-18ab523cd4aa4b4881d90e18de3aea82.r2.dev
  DEBIT: 64k
  APP_ID: com.coranmaradi.complet
  APP_NAME: Coran Maradi

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Recuperer l'application web
        run: |
          set -euo pipefail
          mkdir -p proj/www
          cd proj/www
          for f in index.html sourates.js config.js manifest.json icon-192.png icon-512.png; do
            curl -fsSL --retry 5 --retry-delay 3 -o "$f" "$SITE/$f"
          done
          if ! grep -q "EMBARQUE" config.js; then
            echo "ERREUR : la version v6 de l'application n'est pas encore en ligne sur Cloudflare."
            exit 1
          fi
          sed -i "s#^const AUDIO_BASE = .*#const AUDIO_BASE = 'audio/';#" config.js
          sed -i "s#^const EMBARQUE = .*#const EMBARQUE = true;#" config.js
          grep -n "^const " config.js

      - name: Telecharger et alleger les audios
        run: |
          set -euo pipefail
          mkdir -p src proj/www/audio
          for i in $(seq 1 114); do
            n=$(printf "%03d" "$i")
            curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors -o "src/$n.mp3" "$AUDIO_SOURCE/$n.mp3"
            ffmpeg -nostdin -loglevel error -y -i "src/$n.mp3" -vn -map_metadata -1 -codec:a libmp3lame -b:a "$DEBIT" -ac 1 "proj/www/audio/$n.mp3"
            rm -f "src/$n.mp3"
            echo "Sourate $n prete"
          done
          test "$(ls proj/www/audio | wc -l)" -eq 114
          du -sh proj/www/audio

      - name: Creer le projet Android
        working-directory: proj
        run: |
          set -euo pipefail
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap telemetry off || true
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android

      - name: Personnaliser l'application
        working-directory: proj
        run: |
          set -euo pipefail
          RES=android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp www/icon-192.png "$RES/mipmap-$d/$n.png"
            done
          done
          ffmpeg -nostdin -loglevel error -y -f lavfi -i color=c=0x0f5132:s=480x480 -frames:v 1 vert.png
          find "$RES" -name 'splash.png' -exec cp vert.png {} \;
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          cat > "$MAIN" <<EOF
          package ${APP_ID};

          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onPause() {
                  super.onPause();
                  WebView w = (getBridge() != null) ? getBridge().getWebView() : null;
                  if (w != null) {
                      w.onResume();
                      w.resumeTimers();
                  }
              }
          }
          EOF
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> android/gradle.properties

      - name: Construire l'APK
        working-directory: proj/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          ls -la app/build/outputs/apk/debug/

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp proj/android/app/build/outputs/apk/debug/app-debug.apk Coran-Maradi-complet.apk
          ls -la Coran-Maradi-complet.apk
          gh release create "apk-$(date +%Y%m%d-%H%M)" Coran-Maradi-complet.apk --repo "${{ github.repository }}" --title "Coran Maradi (tout-en-un)" --notes "Application avec les 114 sourates incluses, utilisable sans internet."
